[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmtc-record"
version = "0.0.1"
description = "Open core for a Florida MMTC internal seed-to-sale system (Rule 64-4.221/64-4.222, Form DH5059)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The MMTC Record Authors" }]
keywords = ["cannabis", "seed-to-sale", "florida", "compliance", "mmtc"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmtc_record = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
